<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ευχαριστούμε | ΑΦΟΙ SHEHU</title>
    <link rel="icon" type="image/png" href="assets/logo_transparent.png">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .ty { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .ty .glass-card { max-width: 540px; text-align: center; }
        .ty .ring {
            width: 92px; height: 92px; margin: 0 auto 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; color: var(--gold);
            background: rgba(245, 196, 81, 0.1);
            border: 1px solid rgba(245, 196, 81, 0.3);
            animation: floatY 3s var(--ease) infinite alternate;
        }
        .ty h1 { font-size: 2.2rem; margin-bottom: 14px; }
        .ty p { color: var(--muted); font-size: 1.05rem; margin-bottom: 28px; }
    </style>
</head>

<body>
    <div class="bg-aura"></div>
    <div class="bg-grain"></div>
    <main class="ty">
        <div class="glass-card">
            <div class="ring"><i class="ph-fill ph-check-circle"></i></div>
            <h1>Ευχαριστούμε!</h1>
            <p>Το μήνυμά σας στάλθηκε με επιτυχία. Θα επικοινωνήσουμε μαζί σας το συντομότερο δυνατό.</p>
            <a href="/" class="btn btn-gold"><i class="ph ph-arrow-left"></i> Επιστροφή στην Αρχική</a>
        </div>
    </main>
</body>

</html>
