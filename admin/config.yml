backend:
  name: git-gateway
  branch: main

# Προεπιλεγμένος φάκελος για λοιπά αρχεία (π.χ. λογότυπα)
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "el"

backend_commit_messages:
  create: "Νέο περιεχόμενο: {{slug}}"
  update: "Ενημέρωση έργων: {{slug}}"
  uploadMedia: "Νέα φωτογραφία: {{path}}"
  deleteMedia: "Διαγραφή φωτογραφίας: {{path}}"

# Κάθε κατηγορία = δικό της αρχείο + δικός της φάκελος εικόνων.
# Ό,τι ανεβάζεις στις "Ανακαινίσεις" πάει αυτόματα στο assets/renovations/ κ.ο.κ.
collections:
  - name: "portfolio"
    label: "Έργα (Portfolio)"
    description: "Διάλεξε κατηγορία και πρόσθεσε φωτογραφίες. Κάθε κατηγορία αποθηκεύει τις φωτογραφίες στον δικό της φάκελο."
    files:
      - name: "renovations"
        label: "🏠 Ανακαινίσεις & Αναπαλαιώσεις"
        file: "content/renovations.json"
        format: "json"
        media_folder: "/assets/renovations"
        public_folder: "/assets/renovations"
        fields:
          - { label: "Τίτλος Κατηγορίας", name: "title", widget: "string" }
          - label: "Φωτογραφίες"
            name: "images"
            widget: "list"
            hint: "Οι φωτογραφίες αποθηκεύονται αυτόματα στον φάκελο assets/renovations/"
            field: { label: "Φωτογραφία", name: "image", widget: "image" }

      - name: "drywall"
        label: "🧱 Ξηρά Δόμηση & Γυψοσανίδες"
        file: "content/drywall.json"
        format: "json"
        media_folder: "/assets/drywall"
        public_folder: "/assets/drywall"
        fields:
          - { label: "Τίτλος Κατηγορίας", name: "title", widget: "string" }
          - label: "Φωτογραφίες"
            name: "images"
            widget: "list"
            hint: "Οι φωτογραφίες αποθηκεύονται αυτόματα στον φάκελο assets/drywall/"
            field: { label: "Φωτογραφία", name: "image", widget: "image" }

      - name: "ironworks"
        label: "🔨 Σιδηροκατασκευές"
        file: "content/ironworks.json"
        format: "json"
        media_folder: "/assets/ironworks"
        public_folder: "/assets/ironworks"
        fields:
          - { label: "Τίτλος Κατηγορίας", name: "title", widget: "string" }
          - label: "Φωτογραφίες"
            name: "images"
            widget: "list"
            hint: "Οι φωτογραφίες αποθηκεύονται αυτόματα στον φάκελο assets/ironworks/"
            field: { label: "Φωτογραφία", name: "image", widget: "image" }

      - name: "churches"
        label: "⛪ Έργα σε Εκκλησίες"
        file: "content/churches.json"
        format: "json"
        media_folder: "/assets/churches"
        public_folder: "/assets/churches"
        fields:
          - { label: "Τίτλος Κατηγορίας", name: "title", widget: "string" }
          - label: "Φωτογραφίες"
            name: "images"
            widget: "list"
            hint: "Οι φωτογραφίες αποθηκεύονται αυτόματα στον φάκελο assets/churches/"
            field: { label: "Φωτογραφία", name: "image", widget: "image" }

      - name: "insulations"
        label: "💧 Μονώσεις & Σκεπές"
        file: "content/insulations.json"
        format: "json"
        media_folder: "/assets/insulations"
        public_folder: "/assets/insulations"
        fields:
          - { label: "Τίτλος Κατηγορίας", name: "title", widget: "string" }
          - label: "Φωτογραφίες"
            name: "images"
            widget: "list"
            hint: "Οι φωτογραφίες αποθηκεύονται αυτόματα στον φάκελο assets/insulations/"
            field: { label: "Φωτογραφία", name: "image", widget: "image" }
